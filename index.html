<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>My Cartoon Network</title>
  <style>
    body {
      background: #0d0d0d;
      color: #fff;
      font-family: 'Trebuchet MS', sans-serif;
      text-align: center;
      padding: 40px;
    }
    h1 {
      font-size: 42px;
      margin-bottom: 20px;
      color: #ff66cc;
      text-shadow: 0 0 10px #ff33aa;
    }
    #player {
      width: 80%;
      max-width: 900px;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(255, 0, 150, 0.5);
      margin-bottom: 25px;
    }
    .controls {
      margin-top: 20px;
    }
    button, select {
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #ff00aa;
      color: #fff;
      cursor: pointer;
      margin: 5px;
      transition: 0.3s;
    }
    button:hover, select:hover {
      background: #ff33cc;
      transform: scale(1.05);
    }
    select {
      background: #222;
      color: #fff;
      border: 2px solid #ff00aa;
    }
  </style>
</head>
<body>

  <h1>My Cartoon Network</h1>

  <video id="player" controls></video>

  <div id="status" style="margin: 15px 0; color: #ffcc00; font-size: 16px; min-height: 24px;"></div>

  <div class="controls">
    <button id="prev">⟵ Попередня серія</button>
    <button id="next">Наступна серія ⟶</button>
    <button id="random">Випадкова серія</button>
    <select id="selector"></select>
  </div>

  <script src="script.js"></script>
</body>
</html>
