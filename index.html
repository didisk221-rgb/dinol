<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>My Cartoon Network</title>
  <link rel="preconnect" href="https://pub-3d26663746cd47e89dc0e8d2cff7aa33.r2.dev" crossorigin>
  <style>
    body {
      background: #0d0d0d;
      color: #fff;
      font-family: 'Trebuchet MS', sans-serif;
      text-align: center;
      padding: 40px;
    }
    h1 {
      font-size: 42px;
      margin-bottom: 20px;
      color: #00fec7;
      text-shadow: 0 0 10px #33ebff;
    }
    #player {
      width: 80%;
      max-width: 900px;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0, 255, 183, 0.492);
      margin-bottom: 25px;
    }
    .controls {
      margin-top: 20px;
    }
    button, select {
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #00ffbb;
      color: #fff;
      cursor: pointer;
      margin: 5px;
      transition: 0.3s;
    }
    button:hover, select:hover {
      background: #33ffc9;
      transform: scale(1.05);
    }
    select {
      background: #222;
      color: #fff;
      border: 2px solid #00ff95;
    }
  </style>
</head>
<body>

  <h1>My Cartoon Network</h1>

  <video id="player" controls preload="metadata"></video>

  <div id="status" style="margin: 15px 0; color: #ffcc00; font-size: 16px; min-height: 24px;"></div>

  <div class="controls">
    <button id="prev">⟵ Попередня серія</button>
    <button id="next">Наступна серія ⟶</button>
    <button id="random">Випадкова серія</button>
    <select id="selector"></select>
    <button id="backward" type="button">-10 сек</button>
    <button id="forward" type="button">+10 сек</button>
    <label for="speed">Швидкість:</label>
    <select id="speed">
      <option value="0.5">0.5x</option>
      <option value="0.75">0.75x</option>
      <option value="1" selected>1x</option>
      <option value="1.25">1.25x</option>
      <option value="1.5">1.5x</option>
      <option value="2">2x</option>
    </select>
    <label>
      <input id="randomAutoplay" type="checkbox">
      Автовідтворення випадкових серій
    </label>
  </div>

  <script src="script.js"></script>
</body>
</html>
